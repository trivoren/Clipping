name: Numination Labs - Render Pipeline

on:
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón desde GitHub

jobs:
  render-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Límite de 1 hora (los renders pesados pueden tardar)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (FFmpeg, Python, yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install yt-dlp

      - name: Install NPM dependencies
        run: npm install

      - name: Download source video (Phase 1)
        run: node scripts/1-download.js

      - name: Transcribe with Groq API (Phase 2)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/2-transcribe.js

      - name: Render 30 Clips (Phase 3)
        run: node scripts/3-render-30-clips.js

      - name: Upload rendered clips
        uses: actions/upload-artifact@v4
        with:
          name: clips-finales
          path: out/clips_finales/
          retention-days: 5
